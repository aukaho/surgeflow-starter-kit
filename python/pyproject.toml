[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surgeflow"
version = "0.2.0"
description = "A small client for SurgeFlow public snapshots and member research endpoints"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SurgeFlow", email = "support@surgeflows.capital" }]
dependencies = ["requests>=2.28"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
notebooks = ["notebook>=7", "pandas>=1.5", "ipywidgets>=8", "ipython>=8"]
test = ["pytest>=7", "pandas>=1.5", "ipython>=8", "nbclient>=0.7", "nbformat>=5", "ipykernel>=6"]
build = ["build"]

[project.urls]
Homepage = "https://surgeflows.capital/membership/api"
Documentation = "https://surgeflows.capital/api/public/openapi.json"
Support = "https://surgeflows.capital/contact"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
